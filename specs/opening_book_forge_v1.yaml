    - "The full admitted component/runtime/action/workspace/configuration binding identifies desired state; root equality alone never identifies retry or compensation."
    - "Successive same-root runtime upgrades capture the actual current enablement and running-intent baseline; repeated and inverse requests converge or fail safely."
    - "Actual daemon activity and exact process absence remain distinct from Task registration and task-instance count."
    - "Fresh preserving restoration omits locks, heartbeat and startup authority. A catalog-only legacy daemon row is admitted as inactive only after positive authoritative native absence of its retained integer PID. It must have the exact schema4 daemon column shape plus ordinary schema5 process_identity migration, exact schema5 metadata, empty process_identity, a known phase, canonical ISO timestamps, nullable canonical cycle timestamps and producer-bounded typed resource/report/error fields. A malformed declared identity, unknown shape, retained lock/heartbeat, present or reused PID, denied or unverifiable query never downgrades to this legacy rule. No process identity is fabricated or persisted, no timestamp expiry proves absence, and the read-only observer never changes catalog bytes."
    - "An unverifiable live legacy orphan fails without PID killing, nonce replacement, or invocation of immutable legacy controllers."
    - "Restored legacy activity requires prior absence, controlled exact-task restart, fresh nonce/phase/heartbeat, exact OS birth/Node executable and unchanged task definition/instance."
    - "Windows registration uses the public SDK flag38 suppression of registration triggers; run is explicit."
