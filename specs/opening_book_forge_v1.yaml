meta:
  spec_id: opening_book_forge_v1
  name: Standalone Continuous Opening Book Forge
  version: 1
  status: active
  owner_subsystem: opening_book_forge
  created: '2026-07-20'
  purpose: >
    Define the independent Node.js producer that incrementally accumulates,
    evaluates, trims, compiles, validates, and publishes opening-book snapshots
    consumed through the existing UCI knowledge-source file contract.

authority:
  production_repository: iteathen/uci-arena-book-forge
  production_builder: src
  runtime_consumer: specs/uci_knowledge_sources_v1.yaml
  rules:
    - "Book Forge never imports engine or UCI runtime source and never mutates a running engine."
    - "The only production boundary is an immutable, mutually validated book snapshot."
    - "Book construction and its test harness are Node-only; no Python book path is retained."
    - "Accumulated knowledge is durable; policy, evaluation, and export changes never require PGN re-ingestion."

runtime:
  node_minimum: 24.15.0
  package_root: .
  default_workspace_windows: '%LOCALAPPDATA%\UCI Arena\Book Forge'
  default_workspace_linux: '$XDG_STATE_HOME/uci-arena/book-forge'
  portable_workspace_environment: BOOK_FORGE_ROOT
  dependencies:
    chess_js: 1.4.0
    echecs_zobrist: 1.0.2
  shipped_python_dependency: false
  schema_identity:
    config: uci_arena_book_forge_config_v1
    status: uci_arena_book_forge_status_v2
    migration:
      - "Previously persisted config may be admitted only when its schema has the exact Book Forge config/version suffix and all normal field validation passes."
      - "A migrated config is normalized in memory to the canonical UCI Arena schema and the legacy prefix is never emitted, copied, or used for product discovery."
      - "Status, startup, fixture, and newly generated configuration output always use the canonical UCI Arena schema."

storage:
  catalog: catalog.sqlite
  observation_shards: 64
  shard_rule: high_six_bits_of_polyglot_key
  position_identity:
    canonical_fen: "first four FEN fields plus halfmove 0 and fullmove 1"
    fingerprint: "first 16 bytes of SHA-256 over canonical FEN UTF-8"
    polyglot_key_storage: big_endian_8_byte_blob
  observation_key: [source_id, chunk_index, month, speed, rating_bucket, position_fingerprint, move]
  observation_values: [games, wins, draws, losses]
  ingestion_status: [pending, processing, complete, error]
  source_lifecycle: [active, quarantined, retired, restored]
  invariants:
    - "Source SHA-256 is unique and ingestion is idempotent."
    - "Chunk aggregation is memory-bounded, deterministic, and idempotently replaceable after interruption."
    - "Sources remain separable so exclusion never requires raw-PGN replay."
    - "Expensive analysis is reusable only under an identical engine, NNUE, and node-tier fingerprint."
    - "Exactly one authoritative dataset contributes observations for an overlap domain; audit-only datasets never enter published counts."
    - "Remote position refresh replaces the complete validated response atomically and never adds cumulative totals to their prior values."

inputs:
  supported: [.pgn, .pgn.gz, .pgn.zst, integration_fixture]
  inbox: "The daemon discovers stable supported files in <workspace>/inbox and deduplicates immutable content by SHA-256."
  filters:
    variant: standard
    speeds: [rapid, classical]
    both_player_ratings_minimum: 2000
    require_normal_result: true
    maximum_ply: 30
  perspective: side_to_move_before_candidate_move
  fixture_rule: "Fixture observations are permanently ineligible for the qualified channel."

acquisition:
  default_enabled: true
  owner: book_forge
  engine_runtime_network_access: forbidden
  primary_provider:
    id: lichess_opening_explorer
    endpoint: 'https://explorer.lichess.org/lichess'
    overlap_domain: lichess_standard_rated
    contribution_mode: authoritative
    filters:
      variant: standard
      speeds: [rapid, classical]
      rating_groups: [2000, 2200, 2500]
      moves: 50
      top_games: 0
      recent_games: 0
      maximum_ply: 30
    move_transport:
      source_castling: king_to_corresponding_rook
      canonical_castling: standard_king_destination
      upstream_evidence:
        repository: lichess-org/lila-openingexplorer
        commit: e8aae1f903931aebc9bf821982b6c098b312c1e7
        input: src/indexer/lichess.rs
        output: src/main.rs
      rules:
        - "The intrinsic provider adapter translates king-to-rook notation only when it identifies an actual legal standard-chess castle at the queried FEN."
        - "Canonical UCI legality remains unchanged; missing rights, missing rooks, check, attacked transit/destination squares, blocked paths, wrong side, and unsupported Chess960 positions grant no castling authority."
        - "Previously admitted standard king-destination UCI remains accepted. Deduplication uses canonical moves, so equivalent source and canonical castling tokens reject the complete response rather than double-counting."
        - "Only a complete validated response reaches atomic observation replacement and child-frontier enqueue; both consume canonical UCI moves."
    credential:
      source: configurable_token_file
      default_path: secrets/lichess_bot_token.txt
      rules:
        - "Read the token only inside the provider adapter and send it only as an authorization header."
        - "Never persist, log, print, hash, copy, or place the token or its contents on a command line."
        - "At every request, bound the absolute configured path, reject every linked or reparse ancestor and final object, and admit one stable regular-file descriptor rather than trusting prior configuration checks."
        - "The admitted physical file must have one link and remain outside the package, suite, and workspace roots; lexical aliases, physical aliases, and a root or path substitution during admission fail closed."
        - "Where the platform exposes no-follow and nonblocking open flags, use them. Pre-open path identity, descriptor identity and mutation fields before and after the bounded read, post-read path identity, and physical resolution must agree."
        - "POSIX credential admission requires the invoking effective user to own the file, owner read permission, and no group or other permission bits. A platform access or descriptor-close failure rejects admission."
        - "Read at most 4096 bytes plus one overflow byte through the descriptor. The exact content is one non-empty printable ASCII bearer token optionally terminated by one LF; all other whitespace, control bytes, extra lines, and oversized content are rejected without normalization."
        - "Every failure returns the single bounded BOOK_FORGE_AUTH unavailable diagnostic without a path or token fragment, and token bytes are retained only by the request that immediately sends them to the fixed provider origin."
        - "Authentication failure opens a visible fail-closed circuit without terminating the daemon."
  frontier:
    seed: standard_start_position
    identity: canonical_position_fingerprint
    minimum_games: 32
    crawl_lcb_gap: 0.10
    ordering: [unqueried_shallowest_ply, highest_rarity_adjusted_quality, overdue_published_position, overdue_frontier_position, fingerprint]
    refresh_days: {published: 7, frontier: 30}
    transposition_deduplication: required
  request_policy:
    concurrency: 1
    minimum_interval_ms: 5000
    daily_request_budget: 2000
    timeout_ms: 10000
    rate_limit_pause_seconds_minimum: 60
    resource_revocation_abort_seconds: 2
    maximum_response_bytes: 1048576
  publication_bootstrap:
    successful_positions: 25
    maximum_wait_minutes: 5
    integration_debounce_minutes: 15
  pgn_audit_followup:
    default_enabled: false
    availability: reserved_not_implemented
    transport: streamed_http_zstd
    contribution_mode: audit_only
    complete_archive_retention: forbidden
    rule: "A Lichess monthly PGN audit may compare Explorer statistics but never contributes observations to a snapshot."
    admission_rule: "Configuration that enables this reserved follow-up fails closed until a streamed audit provider and its tests exist; status never advertises a nonfunctional enabled feature."
  acquisition_only_report:
    rule: >
      A one-shot acquisition-only execution never reports ingestion,
      integration publication, Stockfish analysis, qualified publication, or
      maintenance work. Those report fields remain empty/null even when a
      resource hard stop blocks acquisition; the typed acquisition and
      resource fields alone report that stop.

analysis:
  provider: persistent_stockfish_uci_workers
  required_interrogation: [uciok, readyok, Threads, Hash, bestmove]
  defaults:
    threads_per_worker: 1
    hash_mb_per_worker: 128
    initial_nodes: 250000
    confirmation_nodes: 2000000
  relative_score_perspective: candidate_mover
  lifecycle_rules:
    - "Normally admit a new move at relative loss <= 30 cp."
    - "A 30..45 cp move requires rare-line statistical qualification, no WDL bucket loss, and confirmation analysis."
    - "Quarantine after two current-engine results above 45 cp."
    - "Retire after two results above 70 cp, a decisive WDL loss, or verified forced mate."
    - "Never prune from absolute position evaluation alone."
  failure_recovery:
    - "A Stockfish startup, interrogation, command, or timeout failure is recoverable at the daemon cycle boundary."
    - "The failed analysis stage reports zero completed positions and moves plus a bounded redacted error, then the daemon continues eligible publication, maintenance, sleep, and the next cycle."
    - "Worker cleanup remains mandatory before the cycle continues; a failed stage never substitutes partial or synthetic evidence for a qualified-publication gate."
    - "After initialization and lock acquisition, an unexpected cycle-level failure does not terminate the continuous daemon: it records a bounded error, keeps the heartbeat alive, and retries with exponential backoff from five seconds through five minutes."
    - "One-shot execution remains fail-fast, and irrecoverable configuration, catalog initialization, or singleton-lock failures remain process failures for Task Scheduler to report and restart."

publication:
  snapshot_schema: uci_arena_book_snapshot_v2
  snapshot_files:
    - strong_rare_v1.bin
    - strong_rare_v1.stats
    - strong_rare_v1.policy
    - snapshot.manifest.json
    - evaluation.audit.jsonl
  identity_rule: >
    Snapshot content identity binds the snapshot schema, ordered artifact
    names, exact artifact bytes, and provenance. Renaming or substituting an
    artifact therefore creates a new immutable snapshot identity.
  channels:
    integration:
      automatic: true
      fixture_allowed: true
      runtime_consumable: true
      default_windows_consumer: uci_knowledge_source_opening_book
      gates: [schema, digest, ordering, legality, deterministic_compile]
    qualified:
      automatic: true
      fixture_allowed: false
      gates:
        - current_stockfish_evidence_for_every_emitted_move
        - existing_lcb_and_minimum_game_contract
        - rarity_benefit_without_quality_regression
        - paired_color_elo_lower_bound_at_least_negative_5
        - zero_uci_compatibility_regressions
  atomicity: "Validate an immutable version directory, then atomically replace the channel directory."
  rollback: "Preserve the prior channel version and restore it on failed post-publication validation."
  running_engine_rule: "A running game retains its loaded snapshot. A persistent engine may activate the current stable channel only at engine start, explicit reload, or its engine-owned new-game boundary; publication never changes a game in progress."
  integration_rule: >
    The integration channel is the default operational Windows input for the
    UCI opening-book adapter. It is intentionally useful before strength
    qualification completes; qualified remains the authority for strength and
    release-promotion claims.
  installer_bootstrap:
    owner: provider_release_ci
    component_id: opening_book.standard
    source: deterministic_integration_fixture
    installer_projection:
      discovery:
        kind: opening_book
        locator: {source: component_path, path: opening_books}
      activation:
        kind: opening_book
        source_path: opening_books
        destination_root: knowledge_root
        destination_path: opening_books
    required_label: integration_not_strength_qualified
    purpose: >
      Ensure a clean suite installation has a valid local opening book while
      Book Forge begins bounded acquisition and qualification.
    rules:
      - "The bootstrap is compiled and mutually validated by Book Forge during the provider release build."
      - "The installer and Manager must display its integration status and may not claim qualified playing strength."
      - "A later qualified immutable snapshot atomically supersedes it without changing the component identity."
      - "The provider definition declares its resource role and activation mapping; the Installer never infers either from opening_book.standard or a filename prefix."

bounded_growth:
  maximum_published_moves_per_position: 6
  maximum_published_records: 2000000
  minimum_free_workspace_gb: 75
  maintenance: monthly
  snapshot_versions_retained_per_channel: 4
  detailed_cohort_retention_months: 24
  rules:
    - "Snapshot construction reads shard-backed observations as ordered position groups, uses a compiler-owned temporary on-disk selection spool for global ranking, and keeps memory proportional to one sibling group plus bounded I/O buffers rather than total record count."
    - "Book, statistics, audit, digest, content-identity, and parity validation are incremental; no supported snapshot artifact or parsed row set is loaded completely into memory."
    - "Compiler temporary databases and partial artifact roots are outside immutable snapshot authority and are removed after success or failure."
    - "Compact old observation cohorts without losing source provenance."
    - "Retain compact retired evidence while deleting obsolete PV payloads."
    - "Apply entry/removal hysteresis and re-evaluate stale high-value moves before retirement."
    - "Snapshot and publication-history retention is enforced on every maintenance pass even when monthly cohort compaction is not due, so catalog discovery and disk use cannot grow for a full interval."

resource_governor:
  modes: [paused, courtesy, background_sip, idle_harvest, backoff]
  courtesy:
    worker_limit: 1
    cpu_target_percent: 20
    priority: low
  background_sip:
    stockfish_worker_limit: 2
    threads_per_worker: 1
    duty_cycle_percent: 50
    efficiency_cpu_set_limit: 2
    priority: idle
    power_qos: EcoQoS
    fallback_without_proven_efficiency_cpu_sets: one_low_priority_worker
    rules:
      - "The native helper selects only unparked CPU sets in the lowest EfficiencyClass when the system reports more than one class; it never guesses efficiency cores from processor numbering."
      - "The analysis loop alternates measured work and interruptible rest to bound average load while a foreground UCI engine exists."
      - "A transition from a wider worker/profile allocation into background_sip interrupts the in-flight batch within two seconds, cleans up workers, and resumes at the next durable cycle boundary."
      - "The permit monitor caches expensive native and process-list probes for no more than 500 milliseconds and evaluates them concurrently, so safety polling does not become material background load."
  idle_harvest:
    initial_stockfish_workers: 8
    cpu_target_percent: 80
    ramp: one_worker_per_30_seconds
  backoff_deadline_seconds: 2
  pause_thresholds:
    available_memory_gb: 6
    free_workspace_gb: 75
  windows_helper_scope: [job_objects, eco_qos, efficiency_cpu_sets, input_idle, io_priority, exact_process_instance_query]
  rules:
    - "Back off quickly and ramp slowly with hysteresis."
    - "uci_arena_engine.exe is the priority engine process; heavy Forge work yields while it is running."
    - "Configured priority processes, battery use, thermal throttling, memory pressure, and disk pressure override idle harvesting."
    - "Acquisition requests are abortable and stop within two seconds after resource permission is revoked."

daemon_observability:
  heartbeat_seconds: 15
  stale_seconds: 300
  report_retention: last_cycle_only
  phases: [acquisition, ingestion, analysis, publication, maintenance, sleep, recovering]
  public_status_contract:
    schema: uci_arena_book_forge_status_v2
    control_singleton_type: boolean
    control_paused_type: boolean
    daemon_active_type: boolean
    daemon_active_authority: "A fresh heartbeat plus a live exact process incarnation and a running or recovering phase; a receipt, lock file, task registration, or historical status row alone is never active authority."
    startup_projection: "Public CLI and Manager API status report platform startup registration, enablement, configuration match, and live daemon activity as distinct fields; unavailable inspection is explicit and never inferred from retained evidence."
    rule: >
      Public JSON normalizes SQLite integer storage into typed booleans; storage
      representation must not leak across the CLI contract.
  rules:
    - "startup status dispatches before Catalog construction, schema initialization, migration, workspace rebasing, or acquisition. Its owner observation opens the existing catalog read-only and never repairs records."
    - "Startup activity is active/inactive/unverifiable; unavailable activity is null, not false. A present current incarnation at a legacy record PID is a conservative drain obstacle only, never original-incarnation ownership, daemon activity, or PID-kill authority. Task0 is a Task Scheduler observation only, never daemon exit proof."
    - "The singleton lock and heartbeat bind one exact process instance using a provider-owned nonce plus an OS-derived process-start identity. A numeric pid alone is never owner authority."
    - "Windows identity-dependent composition qualifies process_instance_query_v1 from the explicit selected NativeResourceHelper before using its public queryProcessInstanceSync operation. Pure describe, configuration validation, and artifact validation require no native connection; Linux retains its /proc adapter."
    - "Windows process observations have no PowerShell, discovery, retry, or prewarming fallback. Their admitted PID, exact UTC DateTime.Ticks string, executable-path range, and maximum two-second query budget come from the pinned public native process-instance contract; a smaller caller budget is passed without expansion."
    - "Persisted start identities are exact decimal strings, never rounded numeric tokens. Malformed current-format identity, malformed observed identity, unknown state, denied observation, and invalid PID remain unverifiable and never authorize singleton replacement."
    - "The lock and heartbeat reader share one provider-owned byte cap derived from the public maximum-response bound, sufficient for the maximum Windows path and fixed record envelope. Bounded raw reads use fatal UTF-8 decoding; malformed bytes never become literal replacement characters or a legacy absence proof."
    - "A fresh exact owner is never displaced. A dead or pid-reused owner is reclaimed only after the persisted lock bytes are rechecked immediately before atomic retirement; an unverifiable current owner fails closed."
    - "Legacy pid-only locks use the bounded heartbeat/staleness contract for one-way migration: a fresh matching heartbeat remains owned, while a stale lock is recoverable after the stale deadline even when that pid was reused."
    - "Status reports persisted phase, heartbeat, cycle timestamps, resource mode, bounded last report, and a redacted last error."
    - "A recoverable Stockfish-stage error remains visible in the bounded cycle report without changing the daemon phase to failed."
    - "A recoverable cycle-level error is visible as phase recovering with the consecutive failure count, bounded retry delay, next retry time, and redacted error in last_report while heartbeat updates continue."
    - "The Windows native guard terminates a stale daemon; the persistent native launcher then restarts it with bounded backoff, while Task Scheduler remains a second fallback if the launcher itself exits."
    - "The CLI foreground daemon entrypoint owns the Node process lifetime, including one-shot acquisition; its native supervisor watches that process, not one reusable cycle call. Cycle/lifecycle tests in a continuing test process substitute the ResourceGovernor role through governorFactory while retaining actual configured process-identity queries; default production composition remains ResourceGovernor and its typed permit authority."

cli:
  commands: [init, source_add, source_quarantine, source_retire, source_restore, acquisition_run, acquisition_status, acquisition_retry_auth, daemon, start, stop, pause, resume, status, snapshot_build, qualification_record, maintain, validate, publish, startup_install, startup_status, startup_recover, startup_uninstall, api_describe, api_status, api_outputs_list, api_outputs_inspect, api_config_validate, api_startup_recover]
  background_rule: "daemon --detach starts the same single-instance worker in a hidden detached Node process."
  lifecycle_rule: "start and stop control an existing platform startup registration without creating or deleting it; startup install and startup uninstall remain the only registration mutations."
  machine_output: json
  single_instance: true

manager_integration_api:
  schema: uci_arena_manager_service_api_v1
  version: '1.0'
  transport: cli_json
  invocation: [api]
  operations:
    - describe
    - status
    - outputs_list
    - outputs_inspect
    - config_validate
    - startup_recover
  output_schema: uci_arena_service_output_v1
  output_kind: opening_book.snapshot
  consumer_compatibility:
    consumer_contract: uci_arena_book_snapshot_v2
    rule: >
      A published consumer_contract names the neutral immutable snapshot reader
      contract. Any engine implementing that exact contract may consume the
      artifact after its own full identity, digest, authority and applicability
      checks. consumer_component_id remains the legacy routing hint; it does
      not exclude other conforming readers when consumer_contract is present.
      Outputs without consumer_contract retain their original legacy meaning.
  rules:
    - "The installed component manifest is the only discovery authority for the API entrypoint, version, transport, and invocation prefix."
    - "Manager invokes the service CLI and consumes one JSON response; Book Forge never calls or imports Manager."
    - "startup_recover is a credential-free provider-owned operation that starts only the existing per-user registration, rejects an absent or configuration-mismatched registration, and never creates, replaces, enables, disables, or deletes registration."
    - "The canonical output-inspection invocation is api outputs inspect --id OUTPUT_ID. The output id is a named typed argument, never inferred from a flag name or an unrelated positional value."
    - "Every failed API invocation reports the declared operation identifier, including outputs_inspect, independently of option ordering."
    - "Describe publishes component identity, API compatibility, operations, output kinds, and service-owned schemas."
    - "Configuration, status, and output schema identities resolve to closed JSON Schema documents packaged beneath contracts/."
    - "Output list and inspect return validated immutable snapshot identity, channel, qualification authority, exact manifest and artifact digests, current-channel state, and controlled absolute paths."
    - "A current output also returns live_channel_root for the provider-owned stable published channel after independently validating that directory against the same immutable identity and digest. Historical output inspection returns null and never fabricates a mutable channel locator."
    - "A supplied cursor may suppress an unchanged output list but never changes output authority."
    - "The API validates each snapshot through the normal snapshot validator before exposing it and rejects catalog paths outside config.paths.snapshots."
    - "The API never returns raw catalog rows, SQL paths, source observations, credentials, credential paths, or unvalidated workspace files."
    - "Manager decides installation and promotion; integration snapshots remain installable but explicitly not strength-qualified."
    - "Unknown API major versions and unknown operations fail closed."
    - "Output list advertises at most the one current immutable snapshot for each channel; retained historical catalog rows are available only through exact output inspection and are never traversed during discovery."
    - "The output cursor is derived only from catalog-owned current-channel snapshot ids and manifest digests."
    - "When the supplied cursor exactly matches current catalog state, outputs list returns unchanged without reopening or rehashing immutable snapshot artifacts; a missing or changed cursor still performs normal validation on every current snapshot before returning it."
    - "Output inspection resolves and validates only the exact requested snapshot; its latency never grows with retained catalog history."

windows_startup:
  owner: book_forge_cli
  mechanism: per_user_windows_task_scheduler_logon_task
  task_name: UCI Arena Book Forge
  launcher:
    artifact: native/bin/uci_arena_service_launcher.exe
    pe_subsystem: windows_gui
    node_creation_flags: [CREATE_NO_WINDOW, CREATE_UNICODE_ENVIRONMENT]
    stdio: windows_null_device
    supervision: "The scheduled launcher owns the foreground Node daemon, restarts every unexpected daemon exit after exponential backoff from five seconds through five minutes, and stays alive until Task Scheduler stops the task."
  rules:
    - "startup install registers the absolute native launcher as the task action and passes absolute current Node, Book Forge CLI, workspace, optional config, and installed package working-directory paths."
    - "The scheduled action runs a Windows GUI-subsystem launcher which creates the foreground Node daemon with no console window; it must not add a second detach layer."
    - "Closing any interactive terminal cannot deliver console-close or Ctrl-C events to the scheduled Book Forge process tree."
    - "Launcher startup fails closed when the native launcher is unavailable; a daemon failure remains visible through stale/failed daemon heartbeat state while the launcher retries, and a launcher failure remains visible through Task Scheduler exit status."
    - "The task uses the interactive user token at least privilege, starts after logon, has no execution time limit, and restarts after failure."
    - "Continuous-daemon cycle failures recover inside the foreground Node process; the persistent launcher recovers process crashes, stale-heartbeat termination, and irrecoverable startup failures; Task Scheduler restart remains the fallback for launcher failure."
    - "The launcher resets its restart backoff after a daemon survives at least five minutes, and never treats the continuous daemon's zero exit code as permission to leave the scheduled task idle."
    - "The task allows battery startup because the Book Forge resource governor immediately enters backoff on battery or battery-saver state."
    - "Multiple task instances are forbidden and the daemon lock remains the final single-instance authority."
    - "Installation is idempotent, starts the task immediately by default, writes non-secret registration evidence in the workspace, and never embeds credentials."
    - "Startup inspection uses the pinned public SDK's captured TaskDefinition Enabled boolean and exact typed Exec action; it never parses a private XML formatter or infers enablement from daemon activity. Full saved definitions preserve trigger settings separately from the task gate."
    - "start and startup recover run the existing task and stop ends its current instance without deleting the registration; either start form fails clearly when the task is not registered or no longer matches the current provider configuration."
    - "startup uninstall ends the scheduled instance, deletes the task, and removes only Book Forge startup-registration evidence."
  validation:
    - task_xml_contract_test
    - launcher_pe_gui_subsystem_and_create_no_window_smoke
    - launcher_restarts_failed_daemon_without_task_scheduler_intervention
    - install_query_and_immediate_run_smoke
    - scheduled_process_topology_is_launcher_then_node_without_console
    - startup_status_reports_registered_absolute_action
    - stale_lock_with_reused_live_pid_is_reclaimed
    - exact_live_lock_owner_is_never_displaced
    - manager_api_startup_recover_preserves_registration

linux_startup:
  owner: book_forge_cli
  mechanism: per_user_systemd_service
  unit_name: uci-arena-book-forge.service
  privilege: invoking_user
  rules:
    - "The unit uses the installed package root as WorkingDirectory."
    - "ExecStart contains absolute private-Node, CLI, workspace, and optional config paths."
    - "Installation is idempotent and enables and starts the unit immediately."
    - "start, startup recover, and stop control the registered user unit without enabling, disabling, creating, or deleting it; recovery rejects a configuration mismatch."
    - "No secret value is stored in the unit; only a configuration or token-file path may be referenced."
    - "The daemon lock remains final single-instance authority."

relocatable_install:
  package_root: derived_from_import_meta
  suite_root: explicit_UCI_ARENA_SUITE_ROOT_or_package_root_development_default
  repository_checkout_required: false
  default_token_file: per_user_config_directory_reference
  rules:
    - "Installed startup registrations use packageRoot rather than repositoryRoot."
    - "Stockfish and native helper locations may be supplied by explicit component configuration."
    - "Stockfish resolution belongs to configuration composition: explicit configuration or UCI_ARENA_STOCKFISH wins, then the declared suite component path, then exact executable names in PATH; every selected executable still passes normal UCI interrogation and fingerprinting before authority is granted."
    - "The component artifact declares Book Forge discovery as an active-root resource; Installer and Manager never infer that role from its component id."
    - "The component manifest declares product_data as its suite workspace placement. A conforming Installer resolves that placement beneath its mutable per-user or per-machine product data root, while standalone Book Forge retains its own platform default and explicit --workspace override."
    - "After an exact atomic workspace relocation, Book Forge owns rebasing catalog paths that were descendants of the prior workspace; it records the active workspace root, leaves external source paths unchanged, and applies all catalog path updates in one transaction."
    - "A legacy catalog may infer one prior workspace root only from structurally valid snapshot paths. Relocation fails closed when prior-root evidence is absent or ambiguous, the prior workspace still exists, a catalog-owned path escapes the inferred root, or a required relocated snapshot or published directory is missing or linked."
    - "The component publishes a bounded installer-integration entrypoint that accepts only the versioned installation context, renders Book Forge-owned configuration, and never reads a credential file."
    - "Installer supplies dependency and saved-locator paths through declared bindings; Installer does not interpret Book Forge configuration fields or acquisition behavior."
    - "The component manifest declares Book Forge's exact startup action arguments, workspace/configuration flags, response envelope, and required configuration-match evidence; Installer executes that data without knowing Book Forge's CLI shape."

validation:
  required:
    - polyglot_and_sidecar_parity_with_cpp_and_standard_vectors
    - fixture_can_promote_only_to_integration
    - crash_resume_without_count_drift
    - duplicate_source_idempotence
    - deterministic_snapshot_bytes
    - atomic_workspace_relocation_rebases_only_catalog_owned_paths
    - ambiguous_or_incomplete_workspace_relocation_fails_closed
    - malformed_or_partial_snapshot_never_becomes_current
    - uci_load_selection_searchmoves_fallback_and_replacement
    - stockfish_fingerprint_and_node_tier_cache_authority
