  result_contract: arena_provider_lifecycle_result_v1
  transactional_authority: arena_provider_lifecycle_transactional_v1
  rules:
    - "The neutral lifecycle CLI branches before Catalog construction or migration."
    - "Pre captures actual before state and a staged-public-payload/root/launch plan without guessing a future Node tuple; post admits and persists the actual destination/runtime binding before effects. Controller paths are not operation identities."
    - "After positively proven quiescence only, immutable0.4.4 restoration may transactionally reverse the exact schema4-to5 transient identity delta without altering historical records; unknown schemas or live/unknown retained identities fail without change."
    - "Original bounded private before-state is persisted before any task gate, registration, run, or deletion effect."
