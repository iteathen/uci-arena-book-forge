phase_specific_resource_permits_2026_07_20:
  status: active
  problem: >
    A persistent foreground UCI engine process must not block the complete
    daemon cycle, including low-rate Explorer acquisition, or a continuously
    running bot can prevent its own integration book from growing.
  work_classes:
    acquisition:
      cost: lightweight_network_and_sqlite
      allowed_with_idle_engine_process: true
      mode: courtesy
    integration_publication:
      cost: bounded_node_compile_and_atomic_publish
      allowed_with_idle_engine_process: true
      mode: courtesy
    stockfish_analysis:
      cost: heavy_cpu
      allowed_with_engine_process: true
      mode: background_sip
    ingestion_and_maintenance:
      cost: potentially_heavy_io_cpu
      allowed_with_engine_process: false
  hard_stops:
    - operator_pause
    - battery_or_battery_saver
    - insufficient_disk
    - insufficient_memory
    - restrictive_processor_power_limit_under_load
    - compiler_or_build_process
  rules:
    - "ResourceGovernor returns a typed permit for a requested work class; a generic allowed boolean cannot authorize every phase."
    - "An active uci_arena_engine.exe process downgrades permitted lightweight work to courtesy, permits Stockfish only through background_sip, and continues to block ingestion, qualified publication, and maintenance; the engine process is not by itself a global hard stop."
    - "Long-running Stockfish analysis polls its typed permit and, within two seconds of a foreground UCI engine appearing, either proves that the active worker count and native process profile satisfy background_sip or interrupts and cleans up the wider in-flight batch before a later cycle resumes under the bounded profile."
    - "background_sip performs no GPU work, never increases Threads above one per worker, and may not exceed two Stockfish workers or two proven lowest-efficiency-class CPU sets."
    - "Acquisition retains its two-second revocation/abort contract and one-request-at-a-time rate limit."
    - "A running engine retains its loaded immutable snapshot, so a courtesy publication affects only future engines or explicit reloads."
    - "No permit path reads, logs, hashes, or exposes credential contents."
  validation:
    - "Mocked process/resource states prove acquisition and bounded background_sip analysis advance while uci_arena_engine.exe is present, while ingestion and maintenance do not."
    - "A blocking Stockfish analysis is interrupted promptly when its resource permit is revoked or its active worker/profile allocation exceeds a newly reduced permit."
    - "Every hard stop blocks and aborts all work classes."
    - "Courtesy operation keeps measured foreground engine slowdown below two percent."

shared_heavy_background_lease_2026_07_25:
  status: active
  authority: uci_arena_evidence_service_v1
  schema: uci_arena_background_resource_lease_v1
  producers: [book_forge, uci_arena_evidence_service]
