meta:
  spec_id: book_forge_repository_boundary_v1
  version: 1
  status: active
  owner: release_engineering

repository:
  canonical: iteathen/uci-arena-book-forge
  visibility: public
  source_root: .
  suite_architecture_authority: iteathen/uci-arena-installer

github_automation:
  automatic_ci: read_only
  ci_workflow: .github/workflows/ci.yml
  automatic_validation_triggers: [pull_request, push]
  ci_push_branches: [main, master, 'release/**', 'releases/**']
  forbidden_automatic_release_triggers: [pull_request, push, merge_group, schedule]
  validation_authority: local_before_pull_request_and_merge_plus_required_github_ci
  manual_release:
    workflow: .github/workflows/component-release.yml
    trigger: workflow_dispatch_only
  rules:
    - Pull requests and declared branch pushes run read-only, secret-free
      GitHub-hosted validation; CI does not sign or publish release candidates.
    - Exact local check commands and outcomes are recorded before merge.
    - Component release and provenance run only after explicit operator dispatch
      and are not automatically required pull-request status checks.
    - The dispatched job publishes its verified archive, provider result, and
      Sigstore bundle directly to one explicitly authorized immutable candidate prerelease;
      Actions artifact storage is not candidate transport.
    - The separately authorized suite release coordinator pre-provisions the exact empty candidate at
      the dispatched source head. The component workflow validates that
      identity and state, uploads exactly three assets, and verifies their
      remote names, sizes, and SHA-256 digests before succeeding.
    - A non-draft prerelease and its assets in this public repository are
      publicly accessible. The prerelease flag is not a confidentiality
      boundary, stable suite approval, or opening-book strength qualification.
    - Repository visibility and green CI grant no signing, publication, or
      promotion authority. Drafts remain unpublished until separately
      authorized; all exact source, manifest, digest, provenance, and producer
      qualification gates remain required.

contracts:
  component_ids: [book_forge.service, opening_book.standard]
  installed_cli: services/book-forge/src/cli.mjs
  manager_integration_api:
    schema: uci_arena_manager_service_api_v1
    version: '1.0'
    transport: cli_json
  shared_runtime_package: '@uci-arena/background-service-runtime'
  shared_runtime_lock: vendor/upstream.lock.json

rules:
  - Source imports never escape the repository root.
  - The UCI Arena checkout and Evidence Service checkout are unavailable to clean builds.
  - Vendored upstream packages are regular files and match every digest in the upstream lock.
  - Windows provider payloads contain only application-local redistributable runtime libraries; OS-owned UCRT, API-set, and system-directory DLLs fail release construction.
  - Installed layout, workspace roots, schemas, startup identities, and component ids remain stable.
  - UCI Arena validates snapshots as a consumer but does not build Book Forge releases.
  - UCI Arena Installer is the only suite composition, assembly, and promotion
    authority; Manager owns orchestration of components after installation.
  - Manager discovers the API through arena-component.json and never opens the
    Book Forge catalog, scans the workspace, or infers artifact meaning from
    filenames.
  - Opening-book artifacts declare read-only discovery and bounded knowledge
    activation as separate manifest projections; component identity grants
    neither authority.
  - Unknown API major versions, component substitution, malformed output
    identities, and paths escaping the declared snapshot root fail closed.

validation:
  - exact_vendor_lock
  - repository_import_boundary
  - clean_npm_install
  - source_tests
  - windows_native_helpers_built_before_source_tests_without_native_skips
  - unrelated_working_directory_smoke
  - deterministic_component_candidate
  - keyless_signed_provenance
