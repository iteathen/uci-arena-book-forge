  repository: iteathen/uci-arena-installer
  path: reasoning/suite_graph_v1.yaml

imports:
  objectives: [G-O1, G-O2]
  premises: [G-P4, G-P6, G-P7, G-P9, G-P10, G-P15, G-P17, G-P18, G-P20, G-P21, G-P22, G-P23, G-P24, G-P27, G-P28]
  targets: [G-T4, G-T6, G-T8, G-T10, G-T11, G-T12, G-T13]

local_objectives:
  - id: B-O1
    statement: >
      Produce opening knowledge that measurably improves or usefully tests engine chess
      performance without disguising weak or contaminated evidence as strength.
    derived_from: [G-O1]
    confidence: 0.99
  - id: B-O2
    statement: >
      Make opening-knowledge acquisition and maintenance useful in the background without
      imposing significant operator or foreground-engine cost.
    derived_from: [G-O2, G-T10]
    confidence: 0.97

premises:
  - id: B-P1
    statement: >
      Aggregate public-game frequencies, rare-line coverage, and engine evaluation provide
      different signals and none alone proves a book improves match strength.
    confidence: 0.97
  - id: B-P2
    statement: >
      Integration publication and strength qualification answer different questions:
      exploratory book data can be operationally useful before there is sufficient evidence
      for a strength claim.
    confidence: 0.99
  - id: B-P3
    statement: >
      Source overlap and repeated observations can create false confidence unless their
      contribution is explicitly owned and deduplicated.
    confidence: 0.98
  - id: B-P4
    statement: >
      Background acquisition, ingestion, Stockfish analysis, and maintenance can materially
      contend with the foreground engine for CPU, disk, memory, or scheduling resources and
      thereby perturb the chess behavior the Arena is trying to measure.
    confidence: 0.995
  - id: B-P5
    statement: >
      Immutable published snapshots let engines consume opening knowledge without learning
      producer internals.
    confidence: 0.98

  - id: B-P6
    statement: >
      Opening-book benefit is conditional on the consuming engine, rule/time-control context,
      opponent/opening distribution, and downstream search/model behavior; a book is not
      universally strength-positive merely because it is qualified in one cohort.
    confidence: 0.99
  - id: B-P7
    statement: >
      Changing the opening book changes the experiment distribution and can mask or amplify
      search, model, timing, or engine changes in comparative matches.
    confidence: 0.995
  - id: B-P8
    statement: >
      Human/public-game frequency and rarity are useful priors for coverage but are not the
      same population as elite engine-vs-engine play and therefore do not by themselves
      establish optimal engine moves.
    confidence: 0.99
  - id: B-P9
    statement: >
      Using the same engine/evaluator repeatedly to propose, filter, and then assess book moves
      creates feedback and selection risk unless downstream independent match evidence remains
      a separate qualification gate.
    confidence: 0.98

premise_metadata:
  B-P1: {kind: structural}
  B-P2: {kind: structural}
  B-P3: {kind: material_risk}
  B-P4: {kind: material_risk}
  B-P5: {kind: structural}
  B-P6: {kind: empirical_regular}
  B-P7: {kind: structural}
  B-P8: {kind: empirical_regular}
  B-P9: {kind: material_risk}

implicit_assertions:
  - id: B-A1
    statement: >
      A book that scores well only because its qualification reuses the same correlated source
      evidence can overstate real chess benefit.
    derived_from: [B-P1, B-P3, G-P6]
    confidence: 0.95
  - id: B-A2
    statement: >
      More book coverage is not automatically better if additional moves lower expected
      downstream playing strength.
    derived_from: [B-O1, B-P1]
    confidence: 0.97
  - id: B-A3
    statement: >
      Background acquisition that measurably slows active chess can make the proving ground
      worse even while producing more data.
    derived_from: [B-P4, G-P15]
    confidence: 0.99
  - id: B-A4
    statement: >
      Engine consumption policy and Book Forge production policy should remain separate so a
      book can be replaced or compared without changing the engine's producer assumptions.
    derived_from: [G-P4, B-P5]
    confidence: 0.97

  - id: B-A5
    statement: >
      A book shown beneficial for one engine/runtime/control cannot be assumed equally
      beneficial for another engine or substantially changed runtime without evidence.
    derived_from: [B-P6, G-P6]
    confidence: 0.99
  - id: B-A6
    statement: >
      A search/model comparison that changes book identity between cohorts cannot cleanly
      attribute the outcome to search/model quality unless book difference is the declared
      treatment.
    derived_from: [B-P7, G-P17, G-P21]
    confidence: 0.995
  - id: B-A7
    statement: >
      A frequent or statistically popular move can still be a poor engine move; popularity
      and strength are distinct claims.
    derived_from: [B-P8, B-P1]
    confidence: 0.995
  - id: B-A8
    statement: >
      Reusing one evaluator's preferences throughout proposal and filtering increases
      selection bias; independent paired match qualification is what can upgrade the result
      into a strength claim.
    derived_from: [B-P9, G-P18]
    confidence: 0.985
  - id: B-A9
    statement: >
      A larger source corpus cannot compensate for a source distribution that poorly
      represents the target competitive population.
    derived_from: [B-P8, G-P24]
    confidence: 0.99

  - id: B-A10
    statement: >
      Deterministic integration fixtures and source/compile tests can establish packaging and
      contract behavior but cannot upgrade an opening snapshot into strength-qualified book
      authority without the declared independent match gates.
    derived_from: [G-P28, B-P2, B-P9]
    confidence: 0.999

assertion_metadata:
  B-A1: {inference: conditional, boundary: "Correlated source evidence can still be useful when its dependence is modeled and claims remain scoped."}
  B-A2: {inference: structural, boundary: "Additional coverage can be beneficial when move quality is preserved or improved."}
  B-A3: {inference: conditional, boundary: "Background work is not forbidden; its resource interference must remain below the threshold that changes foreground claims."}
  B-A4: {inference: structural, boundary: "Consumer and producer may share public contracts; separation concerns semantic ownership, not total isolation."}
  B-A5: {inference: conditional, boundary: "Historical qualification can remain valid in its original cohort after later engine changes."}
  B-A6: {inference: structural, boundary: "Book identity may vary intentionally when book is the declared treatment."}
  B-A7: {inference: structural, boundary: "Popularity remains useful as a source/coverage prior despite not being strength proof."}
  B-A8: {inference: risk_implication, boundary: "Evaluator reuse does not automatically invalidate a candidate; independent downstream evidence can counter selection bias."}
  B-A9: {inference: structural, boundary: "A nonrepresentative corpus can still be useful for narrow coverage or stress testing."}
  B-A10: {inference: structural, boundary: "Fixtures remain valid integration/package evidence inside their declared scope."}

implementation_targets:
  - id: B-T1
    name: obtain_relevant_and_diverse_opening_evidence
    statement: >
      Acquire enough relevant opening observations to discover useful common, rare, and
      underexplored positions without assuming source volume alone implies chess value.
    supports: [B-O1, G-T11]
  - id: B-T2
    name: preserve_source_identity_and_dependence
    statement: >
      Retain source provenance, overlap, transposition, and dependence information well enough
      to avoid double counting or false confidence.
    supports: [B-O1, G-T4]
  - id: B-T3
    name: select_opening_moves_for_downstream_chess_value
    statement: >
      Turn admitted evidence into opening choices whose selection criteria are related to
      downstream chess benefit rather than popularity or coverage alone.
    supports: [B-O1]
  - id: B-T4
    name: distinguish_operational_usefulness_from_strength_authority
    statement: >
      Allow exploratory/integration knowledge to be operationally useful while keeping
      strength-qualified claims separate and explicit.
    supports: [B-O1, G-T4]
  - id: B-T5
    name: establish_book_strength_benefit_without_unacceptable_regression
    statement: >
      Qualify promoted opening knowledge with sufficiently independent downstream comparisons
      that can detect meaningful benefit and material regressions in the declared cohort.
    supports: [B-O1, G-T13]
  - id: B-T6
    name: publish_exact_reproducible_consumable_opening_knowledge
    statement: >
      Provide exact, reproducible, versioned opening knowledge whose identity and authority can
      be consumed without access to producer-private state.
    supports: [G-T6, G-T12]
  - id: B-T7
    name: avoid_material_foreground_chess_perturbation
    statement: >
      Keep background acquisition, analysis, and maintenance from materially changing active
      foreground engine behavior used for chess or evidence claims.
    supports: [B-O2, G-T10]
  - id: B-T8
    name: make_long_running_book_production_manageable_and_recoverable
    statement: >
      Keep background book production resumable, bounded, failure-tolerant, and low-burden for
      the operator over long-running acquisition and analysis.
    supports: [B-O2, G-T7, G-T8]
  - id: B-T9
    name: expose_truthful_book_state_and_provenance
    statement: >
      Make acquisition, analysis, publication, qualification, resource state, and provenance
      inspectable without fabricating readiness or authority.
    supports: [B-O2, G-T9]
  - id: B-T10
    name: retain_negative_and_historical_book_evidence
    statement: >
      Preserve failed candidates, superseded snapshots, and historical evidence when they
      remain useful for avoiding repeated mistakes or understanding later decisions.
    supports: [G-T4]

