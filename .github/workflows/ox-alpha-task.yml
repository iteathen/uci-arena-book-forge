name: Ox Alpha AI Task

on:
  workflow_dispatch:
    inputs:
      task:
        description: "Describe the coding task for Ox Alpha"
        required: true
        type: string

permissions:
  contents: write
  pull-requests: write

jobs:
  ox-alpha:
    uses: iteathen/DevBridge/.github/workflows/ox-alpha-reusable.yml@ad1dea49570dcc5476693cc1d4d4ac8fc511f8f3
    with:
      task: ${{ inputs.task }}
    secrets:
      OPENROUTER_API_KEY: ${{ secrets.OPENROUTER_API_KEY }}
