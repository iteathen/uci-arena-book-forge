name: Ox Alpha AI Task

on:
  workflow_dispatch:
    inputs:
      task:
        description: "Describe the coding task for Ox Alpha"
        required: true
        type: string

permissions:
  contents: write
  pull-requests: write

jobs:
  ox-alpha:
    uses: iteathen/DevBridge/.github/workflows/ox-alpha-reusable.yml@753140ac186a5221650d5d313369d9896b95c0ac
    with:
      task: ${{ inputs.task }}
    secrets:
      OPENROUTER_API_KEY: ${{ secrets.OPENROUTER_API_KEY }}
